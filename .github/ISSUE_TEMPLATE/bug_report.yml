name: Bug report
description: Report a reproducible problem with IMSYP Auto Reader
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please remove private data, credentials, tokens, and sensitive log content before submitting.

  - type: input
    id: plugin_version
    attributes:
      label: Plugin version
      description: Version of IMSYP Auto Reader in use.
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: ojs_version
    attributes:
      label: OJS version
      placeholder: e.g. 3.5.0-4
    validations:
      required: true

  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: e.g. 8.2
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Production
        - Staging
        - Development
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Describe what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Enable ...
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Paste only relevant excerpts. Remove credentials, email addresses, tokens, paths containing secrets, and other sensitive data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I confirmed this issue is reproducible.
          required: true
        - label: I checked that the report does not contain credentials or sensitive information.
          required: true
        - label: I checked existing issues for a duplicate.
          required: true
